name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Change to 'master' if your default branch is master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the queue and in-progress
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Adjust to your project's required Node version
          cache: 'npm' # Or 'pnpm' / 'yarn' depending on your package manager

      - name: Install dependencies
        uses: pnpm/action-setup@v3 # Optional: omit if using npm/yarn
        with:
          version: latest
        run: pnpm install # Change to npm install or yarn install

      - name: Build project
        run: pnpm run generate # Change to your build/generate command (e.g., npm run generate)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
