name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch is named master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to avoid conflicts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- OPTIONAL: BUILD STEP ---
      # If you are using Nuxt, Next.js, or SvelteKit and want GitHub to build it for you, 
      # uncomment the lines below. Otherwise, make sure you commit your `.output/public` folder.
      #
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - name: Install dependencies and Build
      #   run: |
      #     npm install
      #     npm run build
      # ----------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This targets exactly the built files inside your hidden directory
          path: './.output/public' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4