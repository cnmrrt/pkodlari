name: Deploy Nuxt.js Static Site

on:
  push:
    branches:
      - main # Hangi dala push yapıldığında çalışacağını belirtin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Projenize uygun Node sürümü
          cache: 'npm' # pnpm veya yarn kullanıyorsanız değiştirebilirsiniz

      - name: Install Dependencies
        run: npm ci

      - name: Generate Static Site
        run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.API_BASE }} # Varsa environment değişkenleriniz

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.output/public # Nuxt 3 için varsayılan statik çıktı klasörü (Nuxt 2 için 'dist')
